name: Project controls Python checks
on:
  pull_request:
    paths:
      - 'Hyperscale-Data-Center/notebooks/**'
      - '.github/workflows/project-controls-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Hyperscale-Data-Center/notebooks/**'
      - '.github/workflows/project-controls-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q Hyperscale-Data-Center/notebooks
      - name: Run unit tests
        run: python -m unittest discover -s Hyperscale-Data-Center/notebooks/tests -v
